name: P010 Lean verification
on:
  pull_request:
    paths:
      - 'formal/P010/**'
      - '.github/workflows/p010-lean.yml'
  push:
    branches: [main]
    paths:
      - 'formal/P010/**'
      - '.github/workflows/p010-lean.yml'
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/P010
          use-mathlib-cache: false
          build: false
          test: false
          lint: false
      - name: Resolve Mathlib dependencies
        working-directory: formal/P010
        run: lake update
      - name: Retrieve compiled Mathlib cache
        working-directory: formal/P010
        run: lake exe cache get
      - name: Kernel-check P010 formalization
        working-directory: formal/P010
        run: lake build P010
