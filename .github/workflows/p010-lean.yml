name: P010 Lean verification
on:
  pull_request:
    paths:
      - 'formal/P010/**'
      - '.github/workflows/p010-lean.yml'
  push:
    branches: [main]
    paths:
      - 'formal/P010/**'
      - '.github/workflows/p010-lean.yml'
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and the pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Mathlib dependencies
        working-directory: formal/P010
        run: |
          lake update
          lean --version
      - name: Retrieve compiled Mathlib cache
        working-directory: formal/P010
        run: lake exe cache get
      - name: Kernel-check P010 formalization
        working-directory: formal/P010
        run: lake build P010
